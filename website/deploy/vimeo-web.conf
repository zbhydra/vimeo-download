server {
    listen 80;
    # Cloudflare Flexible SSL 在边缘终止 HTTPS，源站只监听 HTTP/80。
    server_name vimeodownloader.app www.vimeodownloader.app;

    root /data/vimeo-download/website/current;
    index index.html;

    charset utf-8;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ ^/assets/icons/(?:logo|credits)\.svg$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:7900;
    }
    location ~* \.(?:css|gif|ico|jpe?g|js|mjs|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~ /\. {
        deny all;
    }

    # Astro 以目录格式输出页面。直接检查构建产物中的 index.html，使当前及以后新增的页面
    # 都得到一次 HTTPS canonical 跳转，无需在 Nginx 维护第二份路由表。
    location ~ "^/.*[^/]$" {
        if (-f $request_filename/index.html) {
            return 301 https://$host$uri/$is_args$args;
        }
    }
}
