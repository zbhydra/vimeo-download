server {
    listen 80;
    # 测试站点使用生产站点同根域的独立子域。
    server_name test-vimeodownloader.app;

    root /data/vimeo-web-test/current;
    index index.html;

    access_log /usr/local/nginx/logs/test-vimeo-web.access.log;
    error_log /usr/local/nginx/logs/test-vimeo-web.error.log;

    charset utf-8;

    if ($http_user_agent ~* (Googlebot|bingbot|Storebot-Google)) {
        return 403;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ ^/assets/icons/logo\.svg$ {
        proxy_set_header Host test-api.vimeodownloader.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        # TODO(待确认): 9700 全仓仅此一处，仓内没有任何配置 / 文档 / 脚本定义测试机后端端口
        # （`backend/deploy/` 需显式传入 .env，而仓内无 .env.test；docs/ops/ 为空），且它与生产同位置的 7900
        # 及端口表都不一致。无法从仓库判断它是测试机刻意独立端口还是历史笔误，故保持原值，需 ops 确认后再定。
        proxy_pass http://127.0.0.1:9700;
    }
    location ~* \.(?:css|gif|ico|jpe?g|js|mjs|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~ /\. {
        deny all;
    }

    # Astro 以目录格式输出页面。直接检查构建产物中的 index.html，使当前及以后新增的页面
    # 都得到一次 HTTPS canonical 跳转，无需在 Nginx 维护第二份路由表。
    location ~ "^/.*[^/]$" {
        if (-f $request_filename/index.html) {
            return 301 https://$host$uri/$is_args$args;
        }
    }
}
