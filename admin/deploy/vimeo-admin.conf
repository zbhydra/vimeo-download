# Admin 管理后台 Nginx 配置（纯静态 SPA 托管）
#
# 部署路径：{SERVER_DEPLOY_ROOT}/current
# 域名：{DEPLOY_DOMAIN}
#
# 说明：
# - admin 前端直连后端公网 API（build 时注入 VITE_API_BASE_URL），nginx 不再反代 /api/
# - 只监听 80，HTTPS 由外层 Cloudflare 代理终止（与 backend 业务 nginx 一致）
# - SPA fallback：所有非文件请求 fallback 到 index.html
# - 静态资源长缓存（Vite hash 文件名保证缓存安全）
#
# 占位符 {DEPLOY_DOMAIN} / {SERVER_DEPLOY_ROOT} 由 deploy.sh 渲染后上传。

server {
    listen 80;
    server_name {DEPLOY_DOMAIN};

    root {SERVER_DEPLOY_ROOT}/current;
    index index.html;

    charset utf-8;

    # SPA fallback：非文件请求交给 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，确保每次拿到最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 静态资源长缓存（Vite 文件名含 hash，内容变化时文件名也变）
    location ~* \.(?:css|js|mjs|png|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
