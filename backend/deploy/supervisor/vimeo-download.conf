[program:{APP_NAME}]
; 项目路径由部署脚本按 DEPLOY_DIR 渲染。
directory={BACKEND_DIR}

; 收到停止信号后关闭监听，存量请求最多等待 10 秒。
command={BACKEND_DIR}/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port {BACKEND_PORT_PY} --workers 1 --no-access-log --timeout-graceful-shutdown 10

; 用户
user=root

; 自动启动
autostart=true

; 自动重启
autorestart=true

; 启动延迟
startsecs=10

; 重启尝试次数
startretries=3

; 退出码
stopasgroup=true
killasgroup=true

; 应用未能自行退出时，Supervisor 在 10 秒边界强制终止整个进程组。
stopwaitsecs=10

; 重定向输出
stdout_logfile={BACKEND_DIR}/log/supervisor.log
stderr_logfile={BACKEND_DIR}/log/supervisor_error.log

; 日志文件大小
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

; 日志文件保留数量
stdout_logfile_backups=3
stderr_logfile_backups=3

; 进程优先级（数字越小优先级越高）
priority=999

; 环境变量
environment=
    PYTHONUNBUFFERED="1",
    TZ="America/New_York"
