# vimeo-video-downloader API 反向代理配置。
upstream vimeo_download_backend_{BACKEND_PORT_PY} {
    server 127.0.0.1:{BACKEND_PORT_PY};
    keepalive 64;
}

log_format vimeo_business_download_v2_no_query_{BACKEND_PORT_PY} '$remote_addr - $remote_user [$time_local] '
                                                               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                                               '"$http_user_agent"';

server
{
    listen 80;
    server_name {NGINX_SERVER_NAME};
    large_client_header_buffers 4 16k;

    # Website 依赖读取严格鉴权的 401；没有 always 时 nginx 只给成功响应加 CORS 头，
    # 浏览器会把真实 401 降级成不可区分的网络错误，导致过期登录态无法清理。
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Device-Id, X-Client-Product, Accept-Language' always;
    add_header Access-Control-Max-Age 1728000 always;

    if ($request_method = OPTIONS) { return 204; }

    # 隐藏后端返回的 CORS 头，避免重复
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Max-Age;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 业务节点会兜底承载 download-v2 大响应流，必须直传，禁止写入 proxy_temp。
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_request_buffering off;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/api/client/media/download-v2/?$ {
      # GET query 可能携带 bearer token，只记录不含 query 的专用 access log。
      access_log logs/vimeo_business_download_v2_{BACKEND_PORT_PY}_access.log vimeo_business_download_v2_no_query_{BACKEND_PORT_PY};
      error_log /dev/null crit;
      proxy_pass http://vimeo_download_backend_{BACKEND_PORT_PY};
    }

    location = /vimeo-download {
      return 404;
    }

    location ^~ /vimeo-download/ {
      return 404;
    }

    # 转发 API 到后端服务
    location / {
      proxy_pass http://vimeo_download_backend_{BACKEND_PORT_PY};
    }
    location ~ /\.
    {
        deny all;
    }
}
